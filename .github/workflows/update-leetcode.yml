name: Update LeetCode Dashboard Card

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leetcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Fetch LeetCode Data
        run: |
          python scripts/fetch_leetcode.py ragunthan-source

      - name: Render SVG Card
        run: |
          python scripts/render_leetcode.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-card.svg data/leetcode_stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: refresh LeetCode statistics card" && git push)
