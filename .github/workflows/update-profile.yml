name: Update Terminal Profile

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Contributions & Render SVGs
        run: |
          python scripts/fetch_contributions.py --username "${{ github.repository_owner }}"
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
          python scripts/make_tech_stack_svg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/contributions.json assets/*.svg
          
          if git diff --staged --quiet; then
            echo "No profile data changes detected."
          else
            git commit -m "build(profile): auto-update contribution heatmap & SVGs [skip ci]"
            git push
          fi
