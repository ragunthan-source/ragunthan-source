<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 8px; }
      .border { fill: none; stroke: #30363d; stroke-width: 1.5px; rx: 8px; }
      .title-bar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; }
      .window-dot { r: 5px; }
      
      .ascii-text {
        font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 8.8px;
        fill: #c9d1d9;
        white-space: pre;
        letter-spacing: 0px;
      }
      
      .ascii-row {
        opacity: 0;
        animation: typeRow 0.04s ease-out forwards;
      }
      
      .cursor {
        fill: #58a6ff;
        opacity: 0;
        animation: cursorBlink 0.8s infinite step-end 2.225s, cursorFade 0.01s forwards 2.225s;
      }
      
      @keyframes typeRow {
        0% { opacity: 0; transform: translateY(1px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes cursorFade {
        to { opacity: 1; }
      }

      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect width="760" height="662" class="bg" />
  
  <!-- Terminal Header Bar -->
  <path d="M 0,8 A 8,8 0 0 1 8,0 L 752,0 A 8,8 0 0 1 760,8 L 760,35 L 0,35 Z" class="title-bar" />
  <circle cx="18" cy="18" class="window-dot" fill="#ff5f56" />
  <circle cx="34" cy="18" class="window-dot" fill="#ffbd2e" />
  <circle cx="50" cy="18" class="window-dot" fill="#27c93f" />
  <text x="380" y="22" text-anchor="middle" class="title-text">ragunthan@github: ~/ascii-portrait</text>

  <!-- Terminal Border -->
  <rect width="760" height="662" class="border" />

