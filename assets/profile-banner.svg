<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 155" width="100%" height="155" fill="none">
  <defs>
    <!-- Seamless Gradient Line -->
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind Name -->
    <radialGradient id="ambient-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .role-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 3.5px; text-transform: uppercase; }
    .name-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 34px; font-weight: 800; fill: #f0f6fc; letter-spacing: 2px; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 400; fill: #8b949e; letter-spacing: 0.3px; }
    .chip-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 14px; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #3fb950; }
  </style>

  <!-- Transparent Background with Ambient Center Glow -->
  <rect x="0" y="0" width="850" height="155" fill="none" />
  <ellipse cx="425" cy="70" rx="360" ry="60" fill="url(#ambient-glow)" />

  <!-- Top Accent Horizon Line -->
  <line x1="80" y1="2" x2="770" y2="2" stroke="url(#glow-line)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Centered Typography & Info -->
  <g transform="translate(425, 34)" text-anchor="middle">
    <!-- Role Subtitle -->
    <text x="0" y="0" class="role-text">Cloud · Networking · DevOps</text>

    <!-- Name Header -->
    <text x="0" y="38" class="name-text">RAGUNTHAN P R</text>

    <!-- Tagline Description -->
    <text x="0" y="66" class="tagline-text">Architecting Resilient Infrastructure · High-Throughput Networks · Automated CI/CD</text>

    <!-- Operational Status Pill -->
    <g transform="translate(0, 86)">
      <rect x="-145" y="0" width="290" height="28" class="chip-bg" />
      <circle cx="-125" cy="14" r="3.5" fill="#3fb950" />
      <text x="8" y="18" text-anchor="middle" class="status-text">Production Infrastructure &amp; Automation Active</text>
    </g>
  </g>
</svg>
