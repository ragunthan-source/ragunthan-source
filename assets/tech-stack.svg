<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 401" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 8px; }
      .border { fill: none; stroke: #30363d; stroke-width: 1.5px; rx: 8px; }
      .title-bar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; }
      .window-dot { r: 5px; }

      .prompt-line {
        font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 12.5px;
        opacity: 0;
        animation: fadeIn 0.3s ease-out forwards;
      }
      .prompt-user { fill: #58a6ff; font-weight: 700; }
      .prompt-sep { fill: #30363d; }

      .skill-row {
        opacity: 0;
        animation: fadeIn 0.35s ease-out forwards;
      }

      .cat-text {
        font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #39d353;
      }

      .item-text {
        font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        font-weight: 400;
        fill: #e6e6e6;
      }

      .cursor {
        fill: #58a6ff;
        animation: cursorBlink 0.8s infinite step-end;
      }

      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(3px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Base -->
  <rect width="460" height="401" class="bg" />
  
  <!-- Terminal Header Bar -->
  <path d="M 0,8 A 8,8 0 0 1 8,0 L 452,0 A 8,8 0 0 1 460,8 L 460,35 L 0,35 Z" class="title-bar" />
  <circle cx="18" cy="18" class="window-dot" fill="#ff5f56" />
  <circle cx="34" cy="18" class="window-dot" fill="#ffbd2e" />
  <circle cx="50" cy="18" class="window-dot" fill="#27c93f" />
  <text x="230" y="22" text-anchor="middle" class="title-text">ragunthan@github: ~/tech-stack</text>

  <!-- Outer Border -->
  <rect width="460" height="401" class="border" />

  <!-- Skills Card Content -->
  <g>
    <text x="22" y="65" class="prompt-line" style="animation-delay: 0.10s;"><tspan class="prompt-user">ragunthan@github</tspan><tspan class="prompt-sep">:$</tspan> cat skills.json</text>
    <text x="22" y="79" class="prompt-sep" style="animation-delay: 0.18s;">-------------------------------------------------</text>
    <g class="skill-row" style="animation-delay: 0.26s;">
      <text x="22" y="103" class="cat-text">[Programming]</text>
      <text x="22" y="119" class="item-text">Java, Python, C, JavaScript, Dart, SQL</text>
    </g>
    <g class="skill-row" style="animation-delay: 0.34s;">
      <text x="22" y="145" class="cat-text">[Frontend]</text>
      <text x="22" y="161" class="item-text">HTML5, CSS3, React JS, Flutter, Tailwind CSS</text>
    </g>
    <g class="skill-row" style="animation-delay: 0.42s;">
      <text x="22" y="187" class="cat-text">[Backend]</text>
      <text x="22" y="203" class="item-text">Node.js, Express.js, REST API, JWT</text>
    </g>
    <g class="skill-row" style="animation-delay: 0.50s;">
      <text x="22" y="229" class="cat-text">[Database]</text>
      <text x="22" y="245" class="item-text">MySQL, MongoDB</text>
    </g>
    <g class="skill-row" style="animation-delay: 0.58s;">
      <text x="22" y="271" class="cat-text">[DevOps &amp; Tools]</text>
      <text x="22" y="287" class="item-text">Git, GitHub, Jenkins, Docker, Linux, Postman</text>
    </g>
    <g class="skill-row" style="animation-delay: 0.66s;">
      <text x="22" y="313" class="cat-text">[Cloud]</text>
      <text x="22" y="329" class="item-text">AWS (Basic)</text>
    </g>
    <g class="skill-row" style="animation-delay: 0.74s;">
      <text x="22" y="355" class="cat-text">[CS Core]</text>
      <text x="22" y="371" class="item-text">DSA, OOP, DBMS, OS, Networks, Web Security</text>
    </g>
    <text x="22" y="403" class="prompt-line" style="animation-delay: 0.82s;"><tspan class="prompt-user">ragunthan@github</tspan><tspan class="prompt-sep">:$</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
