<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" fill="none">
  <style>
    .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1.5; }
    .card-panel { fill: #161b22; rx: 8px; stroke: #30363d; stroke-width: 1; }
    .section-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f0f6fc; }
    .cat-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #58a6ff; }
    .tech-pill { fill: #21262d; rx: 6px; stroke: #30363d; stroke-width: 1; }
    .tech-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #c9d1d9; }
    .badge-icon { fill: #8b949e; }
  </style>

  <!-- Container -->
  <rect x="0" y="0" width="850" height="260" class="bg" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" class="section-title">⚡ Tech Stack &amp; Technologies</text>
    <line x1="0" y1="14" x2="802" y2="14" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Content Grid (6 Categories in 2 Rows x 3 Columns) -->

  <!-- Row 1, Col 1: Languages -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="254" height="84" class="card-panel" />
    <text x="14" y="22" class="cat-title">Languages</text>
    <g transform="translate(14, 34)">
      <!-- Pills -->
      <rect x="0" y="0" width="58" height="24" class="tech-pill" />
      <text x="29" y="16" text-anchor="middle" class="tech-text">Python</text>

      <rect x="64" y="0" width="48" height="24" class="tech-pill" />
      <text x="88" y="16" text-anchor="middle" class="tech-text">Java</text>

      <rect x="118" y="0" width="34" height="24" class="tech-pill" />
      <text x="135" y="16" text-anchor="middle" class="tech-text">C</text>

      <rect x="158" y="0" width="82" height="24" class="tech-pill" />
      <text x="199" y="16" text-anchor="middle" class="tech-text">JavaScript</text>

      <rect x="0" y="30" width="48" height="24" class="tech-pill" />
      <text x="24" y="46" text-anchor="middle" class="tech-text">SQL</text>
    </g>
  </g>

  <!-- Row 1, Col 2: Frontend -->
  <g transform="translate(298, 62)">
    <rect x="0" y="0" width="254" height="84" class="card-panel" />
    <text x="14" y="22" class="cat-title">Frontend</text>
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="52" height="24" class="tech-pill" />
      <text x="26" y="16" text-anchor="middle" class="tech-text">HTML</text>

      <rect x="58" y="0" width="44" height="24" class="tech-pill" />
      <text x="80" y="16" text-anchor="middle" class="tech-text">CSS</text>

      <rect x="108" y="0" width="54" height="24" class="tech-pill" />
      <text x="135" y="16" text-anchor="middle" class="tech-text">React</text>

      <rect x="168" y="0" width="72" height="24" class="tech-pill" />
      <text x="204" y="16" text-anchor="middle" class="tech-text">Tailwind</text>
    </g>
  </g>

  <!-- Row 1, Col 3: Backend & DB -->
  <g transform="translate(572, 62)">
    <rect x="0" y="0" width="254" height="84" class="card-panel" />
    <text x="14" y="22" class="cat-title">Backend &amp; Database</text>
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="66" height="24" class="tech-pill" />
      <text x="33" y="16" text-anchor="middle" class="tech-text">Node.js</text>

      <rect x="72" y="0" width="76" height="24" class="tech-pill" />
      <text x="110" y="16" text-anchor="middle" class="tech-text">Express.js</text>

      <rect x="154" y="0" width="58" height="24" class="tech-pill" />
      <text x="183" y="16" text-anchor="middle" class="tech-text">MySQL</text>
    </g>
  </g>

  <!-- Row 2, Col 1: DevOps & Cloud -->
  <g transform="translate(24, 158)">
    <rect x="0" y="0" width="398" height="84" class="card-panel" />
    <text x="14" y="22" class="cat-title">DevOps &amp; Cloud</text>
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="42" height="24" class="tech-pill" />
      <text x="21" y="16" text-anchor="middle" class="tech-text">Git</text>

      <rect x="48" y="0" width="62" height="24" class="tech-pill" />
      <text x="79" y="16" text-anchor="middle" class="tech-text">GitHub</text>

      <rect x="116" y="0" width="60" height="24" class="tech-pill" />
      <text x="146" y="16" text-anchor="middle" class="tech-text">Docker</text>

      <rect x="182" y="0" width="52" height="24" class="tech-pill" />
      <text x="208" y="16" text-anchor="middle" class="tech-text">AWS</text>

      <rect x="240" y="0" width="52" height="24" class="tech-pill" />
      <text x="266" y="16" text-anchor="middle" class="tech-text">Linux</text>
    </g>
  </g>

  <!-- Row 2, Col 2: Development Tools -->
  <g transform="translate(442, 158)">
    <rect x="0" y="0" width="384" height="84" class="card-panel" />
    <text x="14" y="22" class="cat-title">Tools &amp; Environments</text>
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="74" height="24" class="tech-pill" />
      <text x="37" y="16" text-anchor="middle" class="tech-text">VS Code</text>

      <rect x="80" y="0" width="70" height="24" class="tech-pill" />
      <text x="115" y="16" text-anchor="middle" class="tech-text">Postman</text>

      <rect x="156" y="0" width="54" height="24" class="tech-pill" />
      <text x="183" y="16" text-anchor="middle" class="tech-text">Figma</text>
    </g>
  </g>
</svg>
